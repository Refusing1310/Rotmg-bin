name: Recycling planner tests

on:
  pull_request:
    paths:
      - "rotmg_recycling/**"
      - "tests/test_recycling.py"
      - "examples/recycling_inventory.json"
      - ".github/workflows/recycling-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m compileall -q rotmg_recycling
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -p 'test_recycling.py' -v
      - name: Example smoke test
        run: python -m rotmg_recycling examples/recycling_inventory.json
