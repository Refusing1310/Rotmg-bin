name: ROTMG Next offline unit tests

on:
  pull_request:
    paths:
      - 'rotmg_next/**'
      - 'tests/test_rotmg_next.py'
      - 'docs/rotmg-next.md'
      - '.github/workflows/rotmg-next-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline unit tests (no third-party packages)
        run: python -m unittest discover -s tests -p 'test_rotmg_next.py' -v
